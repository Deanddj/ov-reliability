[project]
name = "ov-reliability"
version = "0.1.0"
description = "Reliability API for Dutch public transport lines, built on real-time KV6/KV17 data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dean Jaddoe", email = "deanjaddoe@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pyzmq>=27.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ov_reliability"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
