name: ov-reliability

services:
  collector:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OV_CONFIG: /app/config.toml
    volumes:
      - archive:/data/archive
      - ./config.toml:/app/config.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  collector-siri:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OV_CONFIG: /app/config.siri.toml
    volumes:
      - archive-siri:/data/archive
      - ./config.siri.toml:/app/config.siri.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  timetables:
    build: .
    command: ["/app/.venv/bin/python", "-m", "ov_reliability.timetables"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OV_CONFIG: /app/config.toml
    volumes:
      - timetables:/data/timetables
      - ./config.toml:/app/config.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18
    # Vacuum day partitions after 1% new rows instead of 20%, so the API's index-only reads
    # rarely have to check the table for rows added late in the day.
    command: ["postgres", "-c", "autovacuum_vacuum_insert_scale_factor=0.01"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ov
      POSTGRES_DB: ov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ov", "-d", "ov"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loader:
    build: .
    command: ["/app/.venv/bin/python", "-m", "ov_reliability.loader"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OV_CONFIG: /app/config.toml
      OV_DATABASE_URL: postgresql://ov:${POSTGRES_PASSWORD}@postgres/ov
    volumes:
      - archive:/data/archive:ro
      - archive-siri:/data/archive-siri:ro
      - ./config.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    command: ["/app/.venv/bin/python", "-m", "ov_reliability.api"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OV_CONFIG: /app/config.toml
      OV_DATABASE_URL: postgresql://ov:${POSTGRES_PASSWORD}@postgres/ov
    volumes:
      - timetables:/data/timetables:ro
      - ./config.toml:/app/config.toml:ro
    # Only reachable from the host itself until publishing it is decided; API_PORT in .env
    # moves it if 8470 is taken.
    ports:
      - "127.0.0.1:${API_PORT:-8470}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  archive:
  archive-siri:
  timetables:
  pgdata:
