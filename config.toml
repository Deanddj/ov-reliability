[source]
endpoint = "tcp://pubsub.besteffort.ndovloket.nl:7658"
# Subscriptions match by prefix. Keolis's KV15 envelope is listed as "KV15message" (no "s").
topics = [
  "/RIG/KV6posinfo", "/RIG/KV17cvlinfo", "/RIG/KV15messages",
  "/GVB/KV6posinfo", "/GVB/KV17cvlinfo", "/GVB/KV15messages",
  "/IVU/KV6posinfo", "/IVU/KV17cvlinfo", "/IVU/KV15messages",
  "/QBUZZ/KV6posinfo", "/QBUZZ/KV17cvlinfo", "/QBUZZ/KV15messages",
  "/CXX/KV6posinfo", "/CXX/KV17cvlinfo", "/CXX/KV15messages",
  "/KEOLIS/KV6posinfo", "/KEOLIS/KV17cvlinfo", "/KEOLIS/KV15message",
  "/EBS/KV6posinfo", "/EBS/KV17cvlinfo", "/EBS/KV15messages",
  "/ARR/KV6posinfo", "/ARR/KV17cvlinfo", "/ARR/KV15messages",
]

[archive]
directory = "/data/archive"
retention_days = 60
flush_seconds = 5
disk_warning_gb = 10

[monitoring]
# Europe/Amsterdam. An end at or before the start means the window runs past midnight.
service_hours = ["06:00", "00:00"]
topic_silence_minutes = 15
restart_silence_minutes = 10
# Topics that should never be quiet in service hours. KV17 and KV15 can be quiet for long periods.
watched_topics = [
  "/RIG/KV6posinfo", "/GVB/KV6posinfo", "/IVU/KV6posinfo", "/QBUZZ/KV6posinfo",
  "/CXX/KV6posinfo", "/KEOLIS/KV6posinfo", "/EBS/KV6posinfo", "/ARR/KV6posinfo",
]

[timetables]
base_url = "https://data.ndovloket.nl/netex/"
operators = ["arr", "cxx", "ebs", "gvb", "htm", "keolis", "qbuzz", "ret"]
directory = "/data/timetables"
check_minutes = 60
timeout_seconds = 120
disk_warning_gb = 10

[loader]
# Data owners whose KV6 and KV17 events are stored. Other owners stay in the raw archive only.
data_owners = ["HTM", "GVB", "RET", "CXX"]
window_days = 90
poll_seconds = 5

[[loader.archives]]
recorder = "collector"
directory = "/data/archive"

[api]
default_range_minutes = 120
max_range_days = 7
missing_after_minutes = 15
# Lines the API serves, as "operator/mode/code". "*" matches any mode or code.
lines = ["htm/*/*"]
# Lines with no real-time data anywhere: their trips are "unknown", never "missing".
no_realtime = []
# Planning numbers in the timetable that are not a service riders see. HTM plans these every
# day but never runs them; 98 and 99 are test lines.
ignore_planning_numbers = [
  "htm/54", "htm/67", "htm/68", "htm/75", "htm/89", "htm/90", "htm/97", "htm/98", "htm/99",
]

# Which recorder and topics carry the real-time data of which lines.
[[api.realtime]]
lines = ["htm/*/*", "ret/*/*"]
recorder = "collector"
topics = ["/RIG/KV6posinfo", "/RIG/KV17cvlinfo"]
